<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteLens</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div id="wrapper">

    <header class="header">

        <div class="logo">
            <span class="logo-icon">🔍</span>

            <div>
                <h1>SiteLens</h1>
            </div>
        </div>

        <span class="status">● ACTIVE</span>

    </header>


    <main>

        <!-- Website -->
        <section class="site-info">


            <h2 id="site-name">Loading...</h2>

            <p id="site-url">Loading...</p>

        </section>


        <!-- Page information -->
        <section class="card">

            <h3>
                <span>📜</span>
                Page Information
            </h3>

            <div class="info-row">
                <span>Title</span>
                <span id="page-title">-</span>
            </div>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-icon">🔗</span>
                <strong id="link-count">0</strong>
                <span>Links</span>
            </div>

            <div class="stat-card">
                <span class="stat-icon">🖼️</span>
                <strong id="image-count">0</strong>
                <span>Images</span>
            </div>

            <div class="stat-card">
                <span class="stat-icon">H</span>
                <strong id="heading-count">0</strong>
                <span>Headings</span>
            </div>

            <div class="stat-card">
                <span class="stat-icon">📝</span>
                <strong id="form-count">0</strong>
                <span>Forms</span>
            </div>

        </section>

    </main>


    <footer>
        <button>AI analysis</button>
    </footer>

</div>

<script src="index.js"></script>

</body>
</html>
